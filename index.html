<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Sabrina — com amor, Eduardo</title>
  <meta name="description" content="Uma carta de amor interativa de Eduardo Dias para Sabrina Schulz." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__overlay"></div>
  </div>

  <canvas class="hearts-canvas" id="heartsCanvas" aria-hidden="true"></canvas>
  <div class="float-hearts" id="floatHearts" aria-hidden="true"></div>

  <header class="letter-header reveal">
    <p class="letter-header__from" data-slot="header-from"></p>
    <p class="letter-header__to" data-slot="header-to"></p>
  </header>

  <main>
  <!-- Abertura -->
  <section class="section section--opening" id="abertura">
    <div class="opening reveal">
      <figure class="photo-frame photo-frame--hero">
        <img data-img="opening" alt="Sabrina" width="520" height="640" loading="eager" />
      </figure>
      <div class="opening__text glass">
        <h1 class="opening__greeting" data-slot="opening-greeting"></h1>
        <div class="opening__body prose" data-slot="opening-body"></div>
      </div>
    </div>
  </section>

  <!-- Transição -->
  <section class="section section--transition" id="transicao">
    <blockquote class="transition-quote reveal">
      <p data-slot="transition-quote"></p>
    </blockquote>
    <figure class="letter-frame reveal">
      <div class="letter-frame__paper">
        <img data-img="letter" alt="Cartinha" width="480" height="360" loading="lazy" />
      </div>
    </figure>
  </section>

  <!-- Filhos -->
  <section class="section section--children" id="filhos">
    <div class="children-head reveal">
      <p class="children-head__intro" data-slot="children-intro"></p>
      <h2 class="children-head__title" data-slot="children-title"></h2>
    </div>
    <div class="children-grid">
      <article class="reveal-card glass" data-reveal="son">
        <div class="reveal-card__front">
          <span class="reveal-card__emoji" data-slot="son-emoji"></span>
          <h3 data-slot="son-label"></h3>
          <button type="button" class="btn-reveal" data-reveal-btn="son">
            <span data-slot="son-btn"></span>
          </button>
        </div>
        <div class="reveal-card__back" hidden>
          <figure class="photo-frame photo-frame--child">
            <img data-img="son" alt="Nosso filho — imaginação" width="320" height="400" loading="lazy" />
          </figure>
        </div>
      </article>
      <article class="reveal-card glass" data-reveal="daughter">
        <div class="reveal-card__front">
          <span class="reveal-card__emoji" data-slot="daughter-emoji"></span>
          <h3 data-slot="daughter-label"></h3>
          <button type="button" class="btn-reveal" data-reveal-btn="daughter">
            <span data-slot="daughter-btn"></span>
          </button>
        </div>
        <div class="reveal-card__back" hidden>
          <figure class="photo-frame photo-frame--child">
            <img data-img="daughter" alt="Nossa filha — imaginação" width="320" height="400" loading="lazy" />
          </figure>
        </div>
      </article>
    </div>
    <p class="children-after reveal" data-slot="children-after" hidden></p>
  </section>

  <!-- Futuro -->
  <section class="section section--future" id="futuro">
    <div class="future-text glass reveal">
      <div class="prose prose--future" data-slot="future-body"></div>
    </div>
    <figure class="photo-frame photo-frame--spotlight reveal">
      <img data-img="childhood" alt="Sabrina pequena" width="560" height="700" loading="lazy" />
    </figure>
  </section>

  <!-- Encerramento -->
  <section class="section section--closing" id="final">
    <div class="closing reveal">
      <p class="closing__intro" data-slot="closing-intro"></p>
      <h2 class="closing__highlight" data-slot="closing-highlight"></h2>
      <p class="closing__signature">
        <span data-slot="closing-signature"></span><br />
        <strong data-slot="closing-name"></strong>
      </p>
    </div>
  </section>
  </main>

  <script src="./assets/js/content.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
